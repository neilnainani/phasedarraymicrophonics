tica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#374151">clips: lower gain, re-tape knob, redo whole column</text><rect x="600" y="350" width="360" height="56" rx="6" fill="#f9fafb" stroke="#1f2937" stroke-width="1.5" fill-opacity="1"/><text x="612" y="374.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="600" fill="#1f2937">Listen to one take on headphones</text><text x="612" y="392.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#374151">Mic1 = clean sweep; Mic2–4 clearly above hum</text><rect x="600" y="440" width="360" height="56" rx="6" fill="#f9fafb" stroke="#1f2937" stroke-width="1.5" fill-opacity="1"/><text x="612" y="464.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="600" fill="#1f2937">Next column (snake order)</text><text x="612" y="482.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#374151">back to step 1</text><rect x="600" y="540" width="360" height="56" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" fill-opacity="1" stroke-dasharray="5 4"/><text x="612" y="564.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="600" fill="#1f2937">After the last column (X = 1.9)</text><text x="612" y="582.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#374151">go to the repeat takes (Phase 3)</text><line x1="780.0" y1="148" x2="780.0" y2="174" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arr-1f2937)"/><line x1="780.0" y1="224" x2="780.0" y2="256" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-dc2626)"/><text x="788.0" y="241" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="600" fill="#dc2626">yes</text><path d="M 600 286 L 580 286 L 580 120 L 598 120" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-dc2626)"/><path d="M 960 200 L 980 200 L 980 378 L 962 378" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-16a34a)"/><text x="974" y="293.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" font-weight="600" fill="#16a34a">no</text><line x1="780.0" y1="406" x2="780.0" y2="438" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arr-1f2937)"/><line x1="780.0" y1="496" x2="780.0" y2="538" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arr-6b7280)"/><text x="600" y="650" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#6b7280">Expected and harmless: warn &quot;unexpected files ignored: Mic1…&quot;</text><text x="600" y="670" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#6b7280">Healthy take: onset ≈ +300…1500 ms, PNR ≥ ~40 dB</text></svg>
