troke="#1f2937" stroke-width="1.5" fill-opacity="1"/><text x="142" y="112.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="600" fill="#1f2937">1 · Place</text><text x="142" y="130.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#374151">Mover: stand on mark, heading aligned, Z = 0.87 m</text><rect x="130" y="158" width="390" height="48" rx="6" fill="#f9fafb" stroke="#1f2937" stroke-width="1.5" fill-opacity="1"/><text x="142" y="178.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="600" fill="#1f2937">2 · Clear the path</text><text x="142" y="196.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#374151">Everyone on their taped spot, still and silent</text><rect x="130" y="224" width="390" height="48" rx="6" fill="#f9fafb" stroke="#1f2937" stroke-width="1.5" fill-opacity="1"/><text x="142" y="244.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="600" fill="#1f2937">3 · Start capture</text><text x="142" y="262.0" font-family="Consolas, Menlo, monospace" font-size="12" text-anchor="start" font-weight="normal" fill="#374151">Operator: ./capture.sh 1.15 0.6 0.87</text><rect x="130" y="290" width="390" height="48" rx="6" fill="#f9fafb" stroke="#1f2937" stroke-width="1.5" fill-opacity="1"/><text x="142" y="310.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="600" fill="#1f2937">4 · Wait for the cue</text><text x="142" y="328.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#374151">loading, 3 s countdown, then &quot;&gt;&gt;&gt; RECORDING …&quot;</text><rect x="130" y="356" width="390" height="48" rx="6" fill="#f9fafb" stroke="#1f2937" stroke-width="1.5" fill-opacity="1"/><text x="142" y="376.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="600" fill="#1f2937">5 · Play the sweep</text><text x="142" y="394.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#374151">Playback: press play at the cue (within ~1 s)</text><rect x="130" y="422" width="390" height="48" rx="6" fill="#f9fafb" stroke="#1f2937" stroke-width="1.5" fill-opacity="1"/><text x="142" y="442.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="600" fill="#1f2937">6 · Silence</text><text x="142" y="460.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#374151">until &quot;Hardware capture complete&quot;</text><rect x="130" y="488" width="390" height="48" rx="6" fill="#f9fafb" stroke="#1f2937" stroke-width="1.5" fill-opacity="1"/><text x="142" y="508.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="600" fill="#1f2937">7 · Check files</text><text x="142" y="526.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#374151">&quot;Saved&quot; ×4 (Mic1–Mic4), peaks below 1.00</text><rect x="130" y="554" width="390" height="48" rx="6" fill="#f9fafb" stroke="#1f2937" stroke-width="1.5" fill-opacity="1"/><text x="142" y="574.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="600" fill="#1f2937">8 · Log it</text><text x="142" y="592.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#374151">Logger: time, X, Y, take, noise notes</text><line x1="325.0" y1="140" x2="325.0" y2="156" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arr-1f2937)"/><line x1="325.0" y1="206" x2="325